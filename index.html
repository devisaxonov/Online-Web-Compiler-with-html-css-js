<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="editors">
        <div class="editor-box">
          <h3>HTML</h3>
          <textarea id="htmlCode"></textarea>
        </div>
        <div class="editor-box">
          <h3>CSS</h3>
          <textarea id="cssCode"></textarea>
        </div>
        <div class="editor-box">
          <h3>JS</h3>
          <textarea id="jsCode"></textarea>
        </div>
      </div>
      <div class="output-box">
        <div class="output-header">
          <h3><i class="fa-solid fa-play"></i> Output</h3>
          <button id="runBtn">Run</button>
        </div>
        <iframe id="output"></iframe>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
